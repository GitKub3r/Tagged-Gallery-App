services:
    app:
        build:
            context: .
        container_name: tagged_app
        restart: unless-stopped
        ports:
            - "5173:5173"
            - "3000:3000"
        environment:
            NODE_ENV: development
            PORT: 3000
            DB_HOST: mysql
            DB_PORT: 3306
            DB_NAME: media_app
            DB_USER: appuser
            DB_PASSWORD: apppassword
            DB_POOL_MAX: 10
            DB_POOL_MIN: 0
            DB_POOL_IDLE: 10000
            CORS_ORIGIN: http://localhost:5173,http://127.0.0.1:5173
            VITE_API_URL: /api/v1
            VITE_PROXY_TARGET: http://localhost:3000
            CHOKIDAR_USEPOLLING: "true"
            WATCHPACK_POLLING: "true"
        volumes:
            - ./client:/app/client
            - ./server:/app/server
            - ./scripts:/app/scripts
            - /app/client/node_modules
            - /app/server/node_modules
            - /app/node_modules
            - server_uploads:/app/server/uploads
        depends_on:
            mysql:
                condition: service_healthy

    mysql:
        image: mysql:8.0
        container_name: media_mysql
        restart: unless-stopped

        ports:
            - "3306:3306"

        environment:
            MYSQL_ROOT_PASSWORD: rootpassword
            MYSQL_DATABASE: media_app
            MYSQL_USER: appuser
            MYSQL_PASSWORD: apppassword

        volumes:
            - mysql_data:/var/lib/mysql
            - ./database.sql:/docker-entrypoint-initdb.d/database.sql

        command: --default-authentication-plugin=mysql_native_password
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uappuser", "-papppassword"]
            interval: 5s
            timeout: 3s
            retries: 20
    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: media_phpmyadmin
        restart: unless-stopped
        ports:
            - "8080:80"
        environment:
            PMA_HOST: mysql
        depends_on:
            - mysql

volumes:
    mysql_data:
    server_uploads:
